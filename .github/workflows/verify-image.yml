name: Verify image in QEMU
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful image build run ID
        required: true
        default: '40703731345'
        type: string
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-image.yml
      - scripts/vm-verification/**
permissions:
  contents: read
  actions: read
concurrency:
  group: image-qemu-verification
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download the existing image artifact
        uses: actions/download-artifact@v4
        with:
          name: PiDashCam-RPi4B-arm64-800x480
          path: vm-artifact
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run_id || '40703731345' }}
      - name: Install verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xz-utils util-linux e2fsprogs python3 cpio
          docker build -t pidashcam-qemu scripts/vm-verification
          docker run --rm pidashcam-qemu qemu-system-aarch64 -machine help | grep raspi4b
      - name: Boot a test copy and run guest probes
        run: |
          mkdir -p vm-results
          set -o pipefail
          sudo bash scripts/vm-verification/verify.sh 2>&1 | tee vm-results/host.log
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-qemu-verification
          path: vm-results/
          if-no-files-found: error
          retention-days: 14
